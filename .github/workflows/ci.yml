name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # ⚠️ IMPORTANT : install du package en mode editable
      - name: Install project (dev)
        run: pip install -e ".[dev]"

      # sanity check (très important en CI)
      - name: Import check
        run: python -c "import anomaly_detection"

      # Lint
      - name: Ruff
        run: ruff check src tests

      # Type checking
      - name: MyPy
        run: mypy src/anomaly_detection

      # Tests
      - name: Pytest
        run: pytest tests -q --disable-warnings --maxfail=1