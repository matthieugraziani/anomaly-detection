[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Pipeline de détection d'anomalies : Isolation Forest, Autoencoder, LSTM-AE"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["anomaly-detection", "machine-learning", "pytorch", "mlflow"]
dependencies = [
    "scikit-learn>=1.4",
    "torch>=2.2",
    "pandas>=2.2",
    "polars>=0.20",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.35",
    "mlflow>=2.13",
    "pydantic>=2.7",
    "pyod>=1.1",
    "plotly>=5.22",
    "joblib>=1.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff==0.13.0",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pandas-stubs",
]

[project.scripts]
ad-api    = "anomaly_detection.serving.api:run"
ad-dashboard = "anomaly_detection.serving.dashboard:run"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly_detection"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["anomaly_detection"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "plotly.*",
    "pandas.*",
    "kagglehub",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover"]
